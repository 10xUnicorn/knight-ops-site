<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Library — Knight Ops</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--void:#05061a;--gold:#C9922A;--gold2:#8d6a1f;--teal:#00D4C8;--ink:#ececf4;--dim:#8b8ba6;
  --dimmer:#5c5c76;--line:rgba(255,255,255,.09);--card:rgba(255,255,255,.033)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(ellipse 900px 600px at 10% -10%,rgba(123,47,255,.12),transparent 58%),
                   radial-gradient(ellipse 800px 500px at 95% 100%,rgba(0,212,200,.07),transparent 55%);
  background-attachment:fixed}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}

.top{display:flex;align-items:center;gap:14px;padding:15px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;background:rgba(5,6,26,.84);backdrop-filter:blur(18px)}
.logo{display:flex;align-items:center;gap:9px}
.mk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--void);letter-spacing:-.4px}
.logo b{font-size:14.5px}
.logo small{display:block;font-size:10px;color:var(--dim);letter-spacing:.6px;margin-top:-2px}
.sp{flex:1}
.btn{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;background:rgba(255,255,255,.06);
  border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.p{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--void);border-color:transparent}
.btn.p:hover{filter:brightness(1.12)}

.wrap{max-width:1400px;margin:0 auto;padding:26px 24px 70px}
h1{font-size:25px;font-weight:700;letter-spacing:-.3px;margin-bottom:5px}
.lede{color:var(--dim);font-size:14px;margin-bottom:24px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.stat b{display:block;font-size:23px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--teal);margin-top:5px;font-weight:600}

.bar{display:flex;gap:9px;margin-bottom:22px;flex-wrap:wrap}
.bar input,.bar select{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;
  padding:10px 13px;color:var(--ink);font-size:13.5px;font-family:inherit}
.bar input{flex:1;min-width:200px}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  transition:.17s;position:relative;display:block}
.card:hover{transform:translateY(-3px);border-color:rgba(201,146,42,.5);box-shadow:0 14px 38px rgba(0,0,0,.42)}
.th{position:relative;aspect-ratio:16/9;background:#02030f;display:grid;place-items:center;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{font-size:2rem;opacity:.34}
.th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.85);font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
.th .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,26,.28);opacity:0;transition:.17s}
.card:hover .th .pl{opacity:1}
.th .pl i{width:52px;height:52px;border-radius:50%;background:rgba(201,146,42,.95);display:grid;place-items:center}
.th .pl svg{width:20px;height:20px;fill:var(--void);margin-left:3px}
.bd{padding:13px 15px 15px}
.ti{font-size:14px;font-weight:600;line-height:1.42;margin-bottom:5px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.su{font-size:12.3px;color:var(--dim);line-height:1.55;margin-bottom:10px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--dimmer)}
.tag{background:rgba(255,255,255,.06);border-radius:20px;padding:2.5px 9px;font-weight:600;font-size:10.5px}
.tag.t{background:rgba(0,212,200,.12);color:var(--teal)}
.tag.g{background:rgba(201,146,42,.13);color:var(--gold)}
.acts{position:absolute;top:9px;right:9px;display:flex;gap:5px;opacity:0;transition:.17s;z-index:2}
.card:hover .acts{opacity:1}
.acts button{width:31px;height:31px;border-radius:8px;background:rgba(5,6,26,.85);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:13px;transition:.13s}
.acts button:hover{background:var(--gold);color:var(--void)}

.empty{grid-column:1/-1;text-align:center;padding:66px 20px;color:var(--dim)}
.empty i{display:block;font-size:44px;margin-bottom:16px;font-style:normal;opacity:.45}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:8px;font-weight:600}
.empty p{font-size:14px;line-height:1.7;max-width:420px;margin:0 auto 22px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--gold);
  border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(70px);
  background:rgba(5,6,26,.97);border:1px solid var(--line);border-radius:11px;padding:12px 22px;
  font-size:13.5px;font-weight:600;opacity:0;transition:.26s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){.wrap{padding:18px 15px 50px}.logo small{display:none}.btn span{display:none}}
</style>
</head>
<body>

<div class="gate" id="gate"><div><div class="spin"></div><p style="color:var(--dim)">Checking your session…</p></div></div>

<div id="app" style="display:none">
  <div class="top">
    <a class="logo" href="/admin"><span class="mk">KO</span>
      <span><b>Knight Ops</b><small>VIDEO LIBRARY</small></span></a>
    <span class="sp"></span>
    <a class="btn" href="/admin#videos"><span>Full dashboard</span></a>
    <button class="btn p" id="howto">🎥 <span>Get the recorder</span></button>
  </div>

  <div class="wrap">
    <h1>Your recordings</h1>
    <p class="lede">Every screen recording and screenshot, transcribed and ready to share.</p>

    <div class="stats" id="stats"></div>

    <div class="bar">
      <input id="q" placeholder="Search titles, summaries, transcripts…">
      <select id="kind"><option value="">All types</option><option value="video">Recordings</option><option value="screenshot">Screenshots</option></select>
      <select id="vis"><option value="">All visibility</option><option value="unlisted">Link only</option><option value="public">Public</option><option value="private">Private</option></select>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const URL_ = 'https://trpnlkntvulkjerevngm.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRycG5sa250dnVsa2plcmV2bmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0Njg1MDQsImV4cCI6MjA5MDA0NDUwNH0.q9UrZDjbl7c3xC1eTsq46Qg5MmWNogot2ByZ9c_54cM';
const sb = window.supabase.createClient(URL_, ANON);
const $ = s => document.querySelector(s);
const SITE = 'https://www.knightops.biz';
let items = [], count = 0, worker = '', q = '', kind = '', vis = '', t = null;

const fmt = s => { s = Math.max(0, Math.floor(s||0)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`; };
const size = n => { if(!n) return '0 B'; const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<4){n/=1024;i++} return n.toFixed(i?1:0)+' '+u[i]; };
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200); }

async function api(action, payload) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/auth?next=/videos'; throw new Error('no session'); }
  const r = await fetch(`${URL_}/functions/v1/video-manage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ action, ...payload }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `error ${r.status}`);
  return d;
}

async function load() {
  try {
    const d = await api('list', { q: q || undefined, kind: kind || undefined, visibility: vis || undefined, limit: 120 });
    items = d.videos || []; count = d.count || 0; worker = d.worker || '';
    $('#gate').style.display = 'none';
    $('#app').style.display = 'block';
    renderStats(); render();
  } catch (e) {
    if (e.message === 'no session') return;
    $('#gate').innerHTML = `<div><h3 style="margin-bottom:10px">Could not load your library</h3>
      <p style="color:var(--dim);margin-bottom:18px">${esc(e.message)}</p>
      <a class="btn p" href="/admin">Go to the dashboard</a></div>`;
  }
}

function renderStats() {
  let secs = 0, bytes = 0, views = 0, pending = 0;
  items.forEach(v => {
    secs += Number(v.duration_sec) || 0; bytes += Number(v.size_bytes) || 0;
    views += v.view_count || 0;
    if (v.transcript_status === 'pending' || v.transcript_status === 'processing') pending++;
  });
  const cost = ((bytes / 1073741824) * 0.015).toFixed(2);
  $('#stats').innerHTML = `
    <div class="stat"><b>${count}</b><span>Recordings</span></div>
    <div class="stat"><b>${(secs/3600).toFixed(1)}h</b><span>Total runtime</span></div>
    <div class="stat"><b>${views}</b><span>Views</span></div>
    <div class="stat"><b>${size(bytes)}</b><span>Stored</span><em>~$${cost}/mo on R2</em></div>
    ${pending ? `<div class="stat"><b>${pending}</b><span>Transcribing</span></div>` : ''}`;
}

function render() {
  const g = $('#grid');
  if (!items.length) {
    g.innerHTML = `<div class="empty"><i>🎥</i>
      <h3>${q || kind || vis ? 'Nothing matches that filter' : 'No recordings yet'}</h3>
      <p>${q || kind || vis
        ? 'Try a different search or clear the filters.'
        : 'Install the Knight Ops Recorder extension and hit record. Your videos land here automatically, transcribed and ready to share.'}</p>
      ${q || kind || vis ? '' : '<button class="btn p" onclick="document.getElementById(\'howto\').click()">🎥 Get the recorder</button>'}</div>`;
    return;
  }
  g.innerHTML = items.map(v => {
    const title = v.title || v.ai_title || 'Untitled recording';
    const thumb = v.thumb_key ? `${worker}/f/${v.thumb_key}` : (v.poster_key ? `${worker}/f/${v.poster_key}` : '');
    const visLabel = v.visibility === 'public' ? '🌐 Public' : v.visibility === 'private' ? '🔒 Private' : '🔗 Link only';
    const tr = v.transcript_status === 'ready' ? '<span class="tag t">✓ Transcript</span>'
      : v.transcript_status === 'processing' || v.transcript_status === 'pending' ? '<span class="tag t">✦ Transcribing</span>'
      : v.transcript_status === 'failed' ? '<span class="tag">⚠ No transcript</span>' : '';
    return `<a class="card" href="${SITE}/v/${v.slug}" target="_blank" rel="noopener">
      <div class="acts" onclick="event.preventDefault();event.stopPropagation()">
        <button title="Copy link" data-copy="${v.slug}">🔗</button>
        <button title="Manage" data-manage="${v.id}">⚙</button>
      </div>
      <div class="th">
        ${thumb ? `<img src="${thumb}" loading="lazy" alt="">` : `<span class="ph">${v.kind === 'screenshot' ? '📸' : '🎬'}</span>`}
        ${v.kind !== 'screenshot' ? '<span class="pl"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i></span>' : ''}
        ${v.duration_sec ? `<span class="dur">${fmt(v.duration_sec)}</span>` : ''}
      </div>
      <div class="bd">
        <div class="ti">${esc(title)}</div>
        ${v.ai_summary ? `<div class="su">${esc(v.ai_summary)}</div>` : ''}
        <div class="ft">
          ${tr}<span class="tag g">${visLabel}</span>
          <span>${v.view_count || 0} views</span>
          <span>${new Date(v.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
        </div>
      </div></a>`;
  }).join('');
}

$('#grid').addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) { e.preventDefault();
    navigator.clipboard.writeText(`${SITE}/v/${c.dataset.copy}`).then(() => toast('Share link copied'));
    return; }
  const m = e.target.closest('[data-manage]');
  if (m) { e.preventDefault(); location.href = `/admin#videos/${m.dataset.manage}`; }
});

const debounce = () => { clearTimeout(t); t = setTimeout(load, 350); };
$('#q').addEventListener('input', e => { q = e.target.value; debounce(); });
$('#kind').addEventListener('change', e => { kind = e.target.value; load(); });
$('#vis').addEventListener('change', e => { vis = e.target.value; load(); });

$('#howto').addEventListener('click', () => {
  alert('Knight Ops Recorder — install in 4 steps\n\n' +
    '1. Open chrome://extensions and turn on Developer mode\n' +
    '2. Click "Load unpacked" and pick the chrome-extension folder in your knight-ops-site repo\n' +
    '3. Open the extension Options and paste your recorder token\n' +
    '4. Pin it. Alt+Shift+R starts a recording from anywhere.\n\n' +
    'Storage worker: ' + (worker || 'not configured yet'));
});

load();
})();
</script>
</body>
</html>
